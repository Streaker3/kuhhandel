<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1c1008">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Kuhhandel">
<title>Kuhhandel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="dim"></div>
  <div id="seats"></div>

  <div id="center">
    <div id="pile-area">
      <div id="deck"></div>
      <div id="revealed"></div>
      <span id="deck-count"></span>
      <div id="tstack" class="tstack"></div>
    </div>
    <div id="plaque" class="paper"></div>
  </div>

  <div id="offer-pile"></div>
  <div id="wallet"></div>
  <div id="actions" class="paper"></div>
  <div id="me-plate"></div>
  <div id="hand"></div>
  <div id="toasts"></div>

  <div id="top-buttons">
    <button id="menu-toggle" class="round" title="Einstellungen">⚙️</button>
    <div id="menu" class="paper">
      <div class="m-lbl">Tempo der Gegner</div>
      <div class="seg" id="m-speed"><button data-s="0">🐢 Langsam</button><button data-s="1">🐇 Normal</button><button data-s="2">⚡ Schnell</button></div>
      <button class="m-item" id="m-log">📜 Spielverlauf</button>
      <button class="m-item" id="m-rules">📖 Regeln</button>
      <button class="m-item" id="m-sound">🔊 Ton an</button>
      <button class="m-item" id="m-skip">⏭ Versteigerung überspringen</button>
      <a class="m-item" id="m-train" href="training.html" target="_blank">📈 KI-Training live</a>
      <button class="m-item danger" id="m-new">🔄 Neues Spiel</button>
    </div>
  </div>
  <aside id="log">
    <header><h3>Spielverlauf</h3><button id="log-close" class="round small" title="Schließen (Esc)">✕</button></header>
    <ol id="log-list"></ol>
  </aside>
</div>

<div id="banner-wrap"><div id="banner"></div></div>

<div id="overlay" class="show">
  <div class="panel" id="start-panel">
    <div class="logo-cards">
      <img src="assets/web/tier_kuh.webp" alt=""><img src="assets/web/tier_esel.webp" alt=""><img src="assets/web/tier_pferd.webp" alt="">
    </div>
    <h1>Kuhhandel</h1>
    <p class="sub">Hausregel-Edition</p>
    <label>Dein Name <input id="in-name" value="Du" maxlength="14"></label>
    <label>Spieler
      <div class="seg" id="in-players">
        <button data-n="3">3</button><button data-n="4" class="on">4</button><button data-n="5">5</button>
      </div>
    </label>
    <label>Gegner
      <div class="seg" id="in-opp">
        <button data-o="ai" class="on">KI</button><button data-o="heuristic">Einfache Bots</button>
      </div>
      <div class="note" id="ai-note"></div>
    </label>
    <label id="level-row">Schwierigkeit
      <div class="seg" id="in-level">
        <button data-l="leicht">Leicht</button><button data-l="mittel">Mittel</button><button data-l="schwer" class="on">Schwer</button>
      </div>
    </label>
    <button class="big" id="btn-start">Spiel starten</button>
    <p class="fan">Inoffizielles Fan-Projekt mit eigenen Hausregeln – nicht verbunden mit Ravensburger.</p>
  </div>
</div>

<script src="js/kuhhandel.js"></script>
<script src="js/ai.js"></script>
<script src="js/market.js"></script>
<script src="js/coach.js"></script>
<script src="js/local.js"></script>
<script src="app.js"></script>
</body>
</html>
