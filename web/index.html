<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuhhandel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="table">
  <div id="felt"></div>
  <div id="stage">

  <div id="opponents"></div>

  <div id="center">
    <div id="deck-area">
      <div id="deck" class="card back"><span id="deck-count"></span></div>
      <div id="revealed"></div>
    </div>
    <div id="hud"></div>
  </div>

  <div id="me">
    <div id="me-plate"></div>
    <div id="wallet-wrap">
      <div id="wallet"></div>
      <div id="wallet-help"></div>
    </div>
    <div id="actions"></div>
    <div id="hand"></div>
  </div>

  <button id="log-toggle" title="Spielverlauf">📜</button>
  <aside id="log"><h3>Spielverlauf</h3><ol id="log-list"></ol></aside>
  <div id="toasts"></div>
  </div>
</div>

<div id="overlay" class="show">
  <div class="panel" id="start-panel">
    <h1>Kuh<span>handel</span></h1>
    <p class="sub">Hausregel-Edition</p>
    <label>Dein Name <input id="in-name" value="Du" maxlength="14"></label>
    <label>Spieler
      <div class="seg" id="in-players">
        <button data-n="3">3</button><button data-n="4" class="on">4</button><button data-n="5">5</button>
      </div>
    </label>
    <button class="big" id="btn-start">Spiel starten</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
